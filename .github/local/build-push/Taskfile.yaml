version: '3'

env:
    GITHUB_TOKEN:
        sh: gh auth token

tasks:
    trigger-workflow-dispatch:
        desc: Runs the build-push workflow locally with workflow_dispatch event
        cmds:
            - |
                act workflow_dispatch \
                --container-architecture linux/amd64 \
                -s GITHUB_TOKEN="{{.GITHUB_TOKEN}}" \
                -e {{.PWD}}/.github/local/build-push/workflow-dispatch-event.json \
                -P ubuntu-24.04=catthehacker/ubuntu:act-22.04 \
                --var DOCKERHUB_USERNAME=user \
                -W .github/workflows/build-push.yaml

    trigger-workflow-tag:
      desc: Runs the build-push workflow locally with tag event
      cmds:
        - |
          act push \
            --container-architecture linux/amd64 \
            -s GITHUB_TOKEN="{{.GITHUB_TOKEN}}" \
            -e {{.PWD}}/.github/local/build-push/push-tag-event.json \
            -P ubuntu-24.04=catthehacker/ubuntu:act-22.04 \
            --skip-checkout \
            --var DOCKERHUB_USERNAME=user \
            -W .github/workflows/build-push.yaml
                
            