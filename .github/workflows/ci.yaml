name: ci
on:
  push:
    branches: [main]

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-south-1

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: backend
            repo: whiteboard/server
            context: ./server
          - service: web
            repo: whiteboard/app
            context: ./App
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1
        with:
          fetch-depth: 0

      - name: Check for changes
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d #v4.0.3
        id: changes
        with:
          filters: |
            src: ${{ matrix.context }}/**

      - name: Skip if no changes
        if: steps.changes.outputs.src != 'true'
        run: echo "No changes detected in ${{ matrix.context }}. Skipping build and deployment."

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        if: steps.changes.outputs.src == 'true'
        with:
          role-to-assume: arn:aws:iam::793168138853:role/github-actions-ecr
          aws-region: ${{ env.AWS_REGION }}

      - id: ecr
        if: steps.changes.outputs.src == 'true'
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7

      - name: Build
        if: steps.changes.outputs.src == 'true'
        run: |
          TAG=${GITHUB_SHA::7}
          IMAGE=${{ steps.ecr.outputs.registry }}/${{ matrix.repo }}:${TAG}
          docker build -t "$IMAGE" "${{ matrix.context }}"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"
          echo "TAG=$TAG" >> "$GITHUB_ENV"

      - name: Scan the image
        if: steps.changes.outputs.src == 'true'
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1   # v0.35.0
        with:
          image-ref: ${{ env.IMAGE }}
          scanners: vuln,secret
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "0"
          format: table

      - name: Push
        if: steps.changes.outputs.src == 'true'
        run: docker push "$IMAGE"

      - name: Check out the manifests repo
        if: steps.changes.outputs.src == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1
        with:
          repository: Abhishek3954/wb-gitops
          token: ${{ secrets.GITOPS_TOKEN }}
          path: gitops

      - name: Bump the tag
        if: steps.changes.outputs.src == 'true'
        run: |
          command -v kustomize >/dev/null || { curl -s "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | bash && sudo mv kustomize /usr/local/bin/; }
          cd gitops/overlays/aws
          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          for i in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            kustomize edit set image "${{ matrix.service }}=${IMAGE}"
            if git diff --quiet; then echo "nothing to commit"; exit 0; fi
            git commit -am "${{ matrix.service }} -> ${TAG}"
            git push origin HEAD:main && exit 0
            sleep $((RANDOM % 5 + 2))
          done
          echo "could not push after 5 attempts" >&2
          exit 1
