name: Close stale issues and prs

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  
permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-24.04
    steps:
      - name: Runs stale action
        uses: actions/stale@1e223db275d687790206a7acac4d1a11bd6fe629 # v10.4.0
        with:
          days-before-stale: 30