server {
    listen 80;

    # 1. Serve React Static Files
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # 2. Reverse Proxy for Server 1 (e.g., Main API)
    location /api1/ {
        proxy_pass http://api-node:8080/; # Trailing slash strips '/api/'
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # 3. Reverse Proxy for Server 2 (e.g., Auth or Analytics)
    location /api2/ {
        proxy_pass http://api-node:8080/; # Trailing slash strips '/auth/'
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }
}