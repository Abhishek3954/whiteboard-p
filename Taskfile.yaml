version: "3"

includes:
    test:
        taskfile: .github/local/test/Taskfile.yaml
    build-push:
        taskfile: .github/local/build-push/Taskfile.yaml

tasks:
    default:
        desc: shows list of available tasks on task command
        cmds:
            - task --list

    test-react:
        dir: App
        desc: run tests for react locally
        cmds:
            - npm run test 

    test-node:
        dir: server
        desc: run tests for node server locally
        cmds:
            - npm run test

    dev-compose:
        desc: Runs docker compose development
        cmds:
            - docker compose -f docker-compose-base.yml -f docker-compose-dev.yml up -d

    prod-compose:
        desc: Runs docker compose production
        cmds:
            - docker compose -f docker-compose-base.yml -f docker-compose-prod.yml up -d

    dev-compose-down:
        desc: Stops the running development compose project
        cmds:
            - docker compose -f docker-compose-base.yml -f docker-compose-dev.yml down

    prod-compose-down:
        desc: Stops the running production compose project
        cmds:
            - docker compose -f docker-compose-base.yml -f docker-compose-prod.yml down