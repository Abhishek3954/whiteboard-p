version: "3"

includes:
    test:
        taskfile: .github/local/test/Taskfile.yaml

tasks:
    default:
        desc: shows list of available tasks on task command
        cmds:
            - task --list

    test-react:
        dir: App
        desc: run tests for react locally
        cmds:
            - npm run test 

    test-node:
        dir: server
        desc: run tests for node server locally
        cmds:
            - npm run test

    compose:
        desc: Runs docker compose locally by building images
        cmds:
            - docker compose up -d --build

    compose-down:
        desc: Stops the running compose project
        cmds:
            - docker compose down
