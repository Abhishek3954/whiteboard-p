version: '3.8'

name: whiteboard

services:
  frontend:
    build:
     context: ./App
     dockerfile: Dockerfile
    container_name: react-client
    networks:
      - my-network
    depends_on:
      - backend

  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: api-node
    networks:
      - my-network
    depends_on:
      - database
  

  database:
    image: mongo:8.3.4-noble
    container_name: mongodb
    volumes:
      - my-volume:/data/db
    networks:
      - my-network


volumes:
  my-volume:

networks:
  my-network:
    driver: bridge
      
        
      