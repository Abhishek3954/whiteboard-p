name: whiteboard

services:
  frontend:
    build:
      context: ./App
      dockerfile: Dockerfile
    container_name: react-client
    ports:
      - "80:80"
    networks:
      - my-network
    depends_on:
      - backend
    restart: unless-stopped

  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    environment:
      - NODE_ENV=production
      - mongoURL=${MONGO_URI:-mongodb://mongodb:27017/whiteboard}
    networks:
      my-network:
        aliases:
          - api-node
          - backend
    depends_on:
      - database
    restart: unless-stopped

  database:
    image: mongo:8.3.4-noble
    container_name: mongodb
    ports:
      - "27017:27017"
    volumes:
      - my-volume:/data/db
    networks:
      my-network:
        aliases:
          - mongodb
          - database
    restart: unless-stopped

networks:
  my-network:
    driver: bridge

volumes:
  my-volume:
