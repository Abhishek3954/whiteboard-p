name: Whiteboard

services:
  Frontend:
    image: jesterheead/app:${APP_TAG}
    container_name: Frontend
    ports:
      - 80:80
    networks:
      - my-network
    depends_on:
      - Backend
    restart: unless-stopped

  Backend:
    image: jesterheead/server:${SERVER_TAG}
    container_name: api-node
    environment:
      - NODE_ENV=production
      - mongoURL=${MONGO_URI}
    networks:
      - my-network
    depends_on:
      - Database
    restart: unless-stopped

  Database:
    restart: unless-stopped

networks:
  my-network:
    driver: bridge

volumes:
  my-volume: